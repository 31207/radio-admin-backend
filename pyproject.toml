[project]
name = "radio-admin-backend"
version = "0.1.0"
description = "校园广播站点歌管理台独立后端（FastAPI + PostgreSQL）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pillow>=10.1.0",
    "openai>=1.0",
    "tzdata>=2024.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
